# OrderTrace infra: Kafka (KRaft), PostgreSQL, and the grafana/otel-lgtm
# all-in-one observability stack (Grafana + Tempo + Prometheus + Loki + OTLP collector).
#
# Host ports are offset (19092 / 15432) so this demo does not clash with the
# other portfolio projects when several compose stacks exist on one machine.

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: ordertrace-kafka
    ports:
      - "19092:9092"
    environment:
      # KRaft mode - no Zookeeper needed.
      # Confluent's canonical single-node layout: internal listeners bind to the
      # container hostname (routable for controller + health checks) and only the
      # host-facing listener binds 0.0.0.0. Host apps connect via localhost:19092.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://ordertrace-kafka:29092,CONTROLLER://ordertrace-kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://ordertrace-kafka:29092,PLAINTEXT_HOST://localhost:19092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@ordertrace-kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkUzOEVBNTcwNTJEMzM2Qk"
    healthcheck:
      # Uses the INTERNAL listener so the advertised EXTERNAL (host) address
      # is not needed from inside the container.
      test: ["CMD", "kafka-topics", "--bootstrap-server", "ordertrace-kafka:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: ordertrace-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ordertrace
      POSTGRES_PASSWORD: ordertrace
      POSTGRES_DB: ordertrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordertrace -d ordertrace"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: ordertrace-otel-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - lgtm-data:/data

volumes:
  pgdata:
  lgtm-data:
